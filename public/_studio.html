<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>studio test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&family=Cairo:wght@400;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css">
<script>window.__W = new URLSearchParams(location.search).get('worker') || 'http://localhost:8787'; localStorage.setItem('blt-social-worker', window.__W)</script></head>
<body style="background:#F5F6F8;padding:20px"><main id="mount"></main><div id="toast" class="toast" role="status"></div>
<script type="module">
const html = await (await fetch('/admin.html')).text();
const doc = new DOMParser().parseFromString(html, 'text/html');
const sec = doc.getElementById('tab-studio'); sec.hidden = false; document.getElementById('mount').append(sec);
const { initStudio, showStudio } = await import('/admin-social.js');
function h(tag, attrs = {}, ...kids) { const el = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'value') el.value = v; else if (k === 'checked') el.checked = !!v; else el.setAttribute(k, v === true ? '' : v); } kids.flat().forEach((k) => k != null && el.append(k.nodeType ? k : String(k))); return el; }
const toast = (m, e) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.toggle('is-error', !!e); t.classList.add('is-on'); window.__lastToast = m; };
const setBusy = (b, on, l) => { b.disabled = on; b.classList.toggle('is-loading', on); if (l) b.querySelector('.btn-label').textContent = l; };
window.confirm = () => true; window.prompt = (q, d) => d;
// in-memory stand-in for Firestore (saved templates), local testing only
const mem = new Map(JSON.parse(localStorage.getItem('_fake_fs') || '[]'));
const keep = () => localStorage.setItem('_fake_fs', JSON.stringify([...mem]));
const fs = {
  collection: (db, name) => ({ name }), doc: (db, name, id) => ({ name, id }),
  serverTimestamp: () => ({ toMillis: () => Date.now() }),
  async getDocs(c) { return { docs: [...mem].map(([id, v]) => ({ id, data: () => ({ ...v, updatedAt: { toMillis: () => v.at } }) })) }; },
  async addDoc(c, v) { const id = Math.random().toString(36).slice(2, 10); mem.set(id, { ...v, at: Date.now() }); keep(); return { id }; },
  async updateDoc(r, v) { mem.set(r.id, { ...v, at: Date.now() }); keep(); },
  async deleteDoc(r) { mem.delete(r.id); keep(); },
};
initStudio({ h, toast, setBusy, db: {}, fs, user: () => ({ email: 'dev@local' }), getToken: async () => (await fetch(`${window.__W}/__token`)).text() });
showStudio();
window.__ready = true;
if (location.search.includes('sel')) setTimeout(() => {
  const st = document.getElementById('studio-stage'); const g = st.querySelector('[data-i="4"]'); const r = g.getBoundingClientRect();
  const ev = (t) => new PointerEvent(t, { bubbles: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, pointerId: 1, button: 0 });
  g.dispatchEvent(ev('pointerdown')); st.dispatchEvent(ev('pointerup'));
}, 2500);
</script></body></html>
