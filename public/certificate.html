<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>شهادة إنجاز | بيت لاهيا تيك</title>
  <meta name="theme-color" content="#0B1220">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="/styles.css?v=13">
  <link rel="stylesheet" href="/certificate.css?v=1">
  <style>
    .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    body.page-cert { background: #E9EBEF; min-height: 100vh; }
    .cert-bar { background: var(--night); color: var(--white); }
    .cert-bar .header-row { min-height: 64px; }
    .cert-bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .cert-stage { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
    .cert-verify {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px 16px;
      background: var(--white); border: 1px solid var(--line); border-radius: 14px; font-size: 15px; color: var(--slate);
    }
    .cert-verify b { color: var(--night); font-family: var(--font-head); }
    .cert-verify .tick { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #ECFDF5; color: var(--emerald-deep); }
    .cert-verify .tick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .cert-verify.is-blank .tick { background: #F1F5F9; color: var(--slate); }
    .cert-shadow { border-radius: 6px; overflow: hidden; box-shadow: 0 1px 2px rgba(11,18,32,.08), 0 24px 60px rgba(11,18,32,.16); }
    .cert-missing { max-width: 460px; margin: 60px auto; text-align: center; background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 36px 24px; display: grid; gap: 12px; justify-items: center; }
    .cert-missing h1 { font-size: 24px; }
    .cert-missing p { color: var(--slate); }
    .cert-help { margin-top: 14px; text-align: center; color: var(--slate); font-size: 14px; }
    .cert-loading { display: grid; place-items: center; min-height: 50vh; }
    .cert-loading .spinner { display: inline-block; width: 34px; height: 34px; border-width: 3px; border-color: rgba(11,18,32,.15); border-top-color: var(--emerald-deep); }
    @page { size: 297mm 210mm; margin: 0; }
    @media print {
      body.page-cert { background: none; min-height: 0; }
      .cert-bar, .cert-verify, .cert-help, .cert-missing { display: none !important; }
      .cert-stage { padding: 0; max-width: none; }
      .cert-shadow { box-shadow: none; border-radius: 0; }
      .cert-fit { height: auto !important; overflow: visible; }
      .cert-fit > .cert { position: static; transform: none; }
    }
  </style>
  <script type="module" src="/certificate.js?v=1"></script>
</head>
<body class="page-cert">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="logo" viewBox="0 0 236 266">
      <g fill="#34D399"><rect x="60" y="0" width="26" height="26" rx="5"/><rect x="150" y="0" width="26" height="26" rx="5"/><rect x="30" y="30" width="26" height="26" rx="5"/><rect x="60" y="30" width="26" height="26" rx="5"/><rect x="90" y="30" width="26" height="26" rx="5"/><rect x="120" y="30" width="26" height="26" rx="5"/><rect x="150" y="30" width="26" height="26" rx="5"/><rect x="180" y="30" width="26" height="26" rx="5"/></g>
      <g fill="#F43F5E"><rect x="0" y="60" width="26" height="26" rx="5"/><rect x="30" y="60" width="26" height="26" rx="5"/><rect x="60" y="60" width="26" height="26" rx="5"/><rect x="90" y="60" width="26" height="26" rx="5"/><rect x="120" y="60" width="26" height="26" rx="5"/><rect x="150" y="60" width="26" height="26" rx="5"/><rect x="180" y="60" width="26" height="26" rx="5"/><rect x="210" y="60" width="26" height="26" rx="5"/><rect x="0" y="90" width="26" height="26" rx="5"/><rect x="30" y="90" width="26" height="26" rx="5"/><rect x="90" y="90" width="26" height="26" rx="5"/><rect x="120" y="90" width="26" height="26" rx="5"/><rect x="180" y="90" width="26" height="26" rx="5"/><rect x="210" y="90" width="26" height="26" rx="5"/><rect x="0" y="120" width="26" height="26" rx="5"/><rect x="30" y="120" width="26" height="26" rx="5"/><rect x="60" y="120" width="26" height="26" rx="5"/><rect x="90" y="120" width="26" height="26" rx="5"/><rect x="120" y="120" width="26" height="26" rx="5"/><rect x="150" y="120" width="26" height="26" rx="5"/><rect x="180" y="120" width="26" height="26" rx="5"/><rect x="210" y="120" width="26" height="26" rx="5"/><rect x="30" y="150" width="26" height="26" rx="5"/><rect x="60" y="150" width="26" height="26" rx="5"/><rect x="120" y="150" width="26" height="26" rx="5"/><rect x="150" y="150" width="26" height="26" rx="5"/><rect x="180" y="150" width="26" height="26" rx="5"/><rect x="30" y="180" width="26" height="26" rx="5"/><rect x="60" y="180" width="26" height="26" rx="5"/><rect x="90" y="180" width="26" height="26" rx="5"/><rect x="120" y="180" width="26" height="26" rx="5"/><rect x="180" y="180" width="26" height="26" rx="5"/><rect x="60" y="210" width="26" height="26" rx="5"/><rect x="90" y="210" width="26" height="26" rx="5"/><rect x="120" y="210" width="26" height="26" rx="5"/><rect x="150" y="210" width="26" height="26" rx="5"/><rect x="90" y="240" width="26" height="26" rx="5"/><rect x="120" y="240" width="26" height="26" rx="5"/></g>
      <g fill="#FDA4AF"><rect x="60" y="90" width="26" height="26" rx="5"/><rect x="150" y="90" width="26" height="26" rx="5"/><rect x="90" y="150" width="26" height="26" rx="5"/><rect x="150" y="180" width="26" height="26" rx="5"/></g>
    </symbol>
  </svg>

  <header class="cert-bar">
    <div class="container header-row">
      <a class="brand" href="/" aria-label="بيت لاهيا تيك — الرئيسية">
        <svg class="brand-mark" width="30" height="34" aria-hidden="true"><use href="#logo"/></svg>
        <span class="brand-text"><span class="brand-kicker">كميونتي تقني</span><span class="brand-name">بيت لاهيا</span></span>
      </a>
      <div class="cert-bar-actions">
        <button class="btn btn-primary btn-sm" type="button" id="print-btn" hidden>اطبع أو احفظ PDF</button>
        <button class="btn btn-ghost btn-sm" type="button" id="copy-btn" hidden>انسخ الرابط</button>
      </div>
    </div>
  </header>

  <main class="cert-stage">
    <div class="cert-loading" id="loading"><span class="spinner" aria-hidden="true"></span><span class="visually-hidden">جاري التحميل…</span></div>

    <div id="cert-view" hidden>
      <div class="cert-verify" id="verify">
        <span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L19 7"/></svg></span>
        <span id="verify-text"></span>
      </div>
      <div class="cert-shadow"><div class="cert-fit" id="cert-fit"></div></div>
      <p class="cert-help" id="help">لتحفظها PDF: اضغط «اطبع أو احفظ PDF» واختار «حفظ كـ PDF». خلّي الاتجاه أفقي، وفعّل «رسومات الخلفية».</p>
    </div>

    <div class="cert-missing" id="missing" hidden>
      <svg width="56" height="63" aria-hidden="true"><use href="#logo"/></svg>
      <h1>ما لقينا الشهادة</h1>
      <p id="missing-msg">الرابط غلط، أو الشهادة انلغت. تأكد من الرابط اللي وصلك، أو تواصل معنا.</p>
      <a class="btn btn-primary" href="/">ارجع للرئيسية</a>
    </div>
  </main>
</body>
</html>
