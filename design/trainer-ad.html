<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;600&family=Readex+Pro:wght@400;700&display=block">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{background:#0B1220;color:#fff;font-family:'Readex Pro',Tahoma,sans-serif;position:relative;box-sizing:border-box;padding:80px 84px;display:flex;flex-direction:column}
body::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px}
body::after{content:"";position:absolute;width:760px;height:760px;left:-220px;top:-180px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.2),transparent 65%)}
.z{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center}
.kicker{display:flex;align-items:center;gap:12px;font-size:30px;color:#34D399}
.kicker i{width:18px;height:18px;border-radius:5px;background:#34D399;display:inline-block}.kicker i:last-of-type{background:#F43F5E}
.badge{border:2px solid #34D399;color:#34D399;border-radius:999px;padding:8px 26px;font-size:26px;font-family:'IBM Plex Sans Arabic';font-weight:600}
h1{margin:70px 0 0;font-size:112px;line-height:1.18;font-weight:700}
h1 span{color:#34D399}
.en{margin-top:18px;direction:ltr;text-align:right;font-size:34px;color:#94A3B8;letter-spacing:1px}
.en b{color:#FDA4AF;font-weight:400}
.lead{margin-top:34px;font-family:'IBM Plex Sans Arabic';font-size:36px;line-height:1.6;color:#CBD5E1;max-width:640px}
.logo{position:absolute;left:84px;bottom:330px;width:230px;z-index:1;filter:drop-shadow(0 20px 40px rgba(244,63,94,.35))}
.info{margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px 24px}
.card small{display:block;font-family:'IBM Plex Sans Arabic';font-size:22px;color:#94A3B8}
.card b{display:block;margin-top:4px;font-size:32px;font-weight:700}
.cta{margin-top:24px;display:flex;justify-content:space-between;align-items:center;background:#34D399;color:#0B1220;border-radius:24px;padding:24px 34px}
.cta strong{font-size:38px}.cta span{font-size:28px;direction:ltr;font-weight:700}

.chips{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px;max-width:700px}
.chips span{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:30px;padding:10px 24px;border-radius:999px;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#E2E8F0}
.chips span.g{border-color:#34D399;color:#34D399}.chips span.r{border-color:#F43F5E;color:#FDA4AF}
h1{font-size:104px}
.cta strong{font-size:40px}
</style></head><body>
<div class="top z"><div class="kicker"><i></i><i></i><i></i>بيت لاهيا تيك</div><div class="badge">كفاءات تدريبية</div></div>
