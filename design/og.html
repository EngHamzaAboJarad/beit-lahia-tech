<!doctype html>
<!-- مصدر صورة المشاركة public/og.png (1200×630). لإعادة توليدها: شوف README › صورة المشاركة -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500&family=Readex+Pro:wght@400;700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0B1220; color: #fff; font-family: 'Readex Pro', Tahoma, sans-serif;
    display: grid; grid-template-columns: 1fr 420px; align-items: center; padding: 0 90px; box-sizing: border-box; position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .copy { position: relative; display: flex; flex-direction: column; gap: 18px; }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 26px; color: #34D399; font-weight: 400; }
  .kicker i { width: 16px; height: 16px; border-radius: 4px; background: #34D399; display: inline-block; }
  .kicker i:last-of-type { background: #F43F5E; }
  h1 { margin: 0; font-size: 78px; line-height: 1.2; font-weight: 700; }
  h1 span { color: #34D399; }
  p { margin: 0; font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; font-size: 28px; color: #CBD5E1; }
  .url { margin-top: 10px; font-size: 22px; color: #94A3B8; direction: ltr; text-align: right; letter-spacing: .5px; }
  .art { position: relative; display: grid; place-items: center; }
  .art::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(52,211,153,.18), transparent 65%); }
  svg { position: relative; width: 330px; height: auto; filter: drop-shadow(0 20px 40px rgba(244,63,94,.3)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="kicker"><i></i><i></i><i></i>كميونتي تقني</div>
    <h1>معاً نبني جيلاً تقنياً<br><span>من بيت لاهيا</span></h1>
    <p>لطلاب التوجيهي والجامعة والخريجين — سجّل وانضم</p>
    <div class="url">beitlahia.tech</div>
  </div>
  <div class="art">
